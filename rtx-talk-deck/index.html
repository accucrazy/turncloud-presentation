<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTX 演講 · NemoClaw × 騰雲 × 地端多模態工作流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f172a; --dim:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --cyan:#06b6d4; --violet:#a855f7; --nv:#76b900;
  --stage-w:1920px; --stage-h:1080px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0b1220;font-family:'Noto Sans TC',-apple-system,sans-serif;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #16213e 0%, #0b1220 70%);}
#stage{position:relative;flex:0 0 auto;width:var(--stage-w);height:var(--stage-h);transform-origin:center center;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;}

/* slide layers */
.slide{position:absolute;inset:0;display:none;background:#000;}
.slide.active{display:block;}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;}
.slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}

/* progress + chrome */
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--nv),var(--cyan));width:0;z-index:40;transition:width .25s ease;}
#chrome{position:fixed;bottom:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;color:#cbd5e1;font-size:13px;letter-spacing:.04em;z-index:40;background:linear-gradient(0deg,rgba(11,18,32,.85),rgba(11,18,32,0));pointer-events:none;}
#chrome .chap{font-weight:700;color:#fff;}
#chrome .sp{flex:1;}
#chrome .count{font-family:'JetBrains Mono',monospace;}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);font-size:22px;cursor:pointer;z-index:41;display:flex;align-items:center;justify-content:center;transition:background .15s;backdrop-filter:blur(6px);}
.nav:hover{background:rgba(255,255,255,.2);}
#prev{left:14px;} #next{right:14px;}
#hint{position:fixed;top:12px;right:14px;color:#94a3b8;font-size:12px;z-index:40;font-family:'JetBrains Mono',monospace;}

/* overview grid */
#grid{position:fixed;inset:0;background:rgba(8,12,22,.97);z-index:60;display:none;grid-template-columns:repeat(5,1fr);gap:10px;padding:24px;overflow:auto;}
#grid.show{display:grid;}
#grid .cell{position:relative;aspect-ratio:16/9;background:#111827;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;}
#grid .cell.cur{border-color:var(--nv);}
#grid .cell img{width:100%;height:100%;object-fit:cover;}
#grid .cell .lbl{position:absolute;left:0;bottom:0;right:0;font-size:10px;color:#cbd5e1;background:rgba(0,0,0,.6);padding:2px 5px;}
#grid .cell .ph{display:flex;align-items:center;justify-content:center;height:100%;color:#475569;font-size:11px;text-align:center;padding:6px;}
</style>
</head>
<body>
<div id="bar"></div>
<div id="viewport"><div id="stage"></div></div>
<button class="nav" id="prev" aria-label="prev">‹</button>
<button class="nav" id="next" aria-label="next">›</button>
<div id="chrome"><span class="chap" id="chap"></span><span class="sp"></span><span class="count" id="count"></span></div>
<div id="hint">← →&nbsp;切換 · O 總覽 · F 全螢幕</div>
<div id="grid"></div>

<script>
/* ──────────────────────────────────────────────
   SLIDE MANIFEST — RTX 演講版
   type: 'image' (src) | 'html' (src=iframe url) | 'pocket' (srcdoc + base 注入)
   章節：
   1) NemoClaw × Nemotron — Nemoclaw.pdf 精選頁截圖（img/nemo/ 內含完整 p01..p33，此處挑精華）
   2) 騰雲產品發表會精選 — 正式 deck 拆頁（pocket/，素材吃線上 POCKET_BASE）
   3) 地端多模態工作流 — 全新手刻（slides/local-*.html）
   ────────────────────────────────────────────── */
/* 精華 12 頁（完整 33 頁圖仍在 img/nemo/，要加回某頁把頁號塞回陣列即可） */
const NEMO = ["p01","p02","p03","p04","p06","p09","p14","p16","p18","p19","p21","p32"];

/* 騰雲發表會精選（要增減頁面：從 ai-talk-deck/pocket/ 複製對應 p*.html 進本 deck 的 pocket/ 再加進陣列）
   完整清單：p02_overview p03_aios_concept p04_s4 p05_harness_skill p06_pandora p07_pandora_demo
   p08_moana p09_moana_culture_flow p10_moana_culture_demo p11_banana p12_banana_split_demo
   p13_banana_video_edit p14_adriana p15_adriana_demo p16_stacey p17_stacey_demo
   p18_ecosystem_chapter p19_raccoon_partnership p20_rytho_partnership p21_luna_partnership p22_s22 p23_redeem */
const POCKET = ["p02_overview","p03_aios_concept","p06_pandora","p11_banana","p13_banana_video_edit","p18_ecosystem_chapter"];

/* 地端多模態工作流（手刻 HTML，1920x1080） */
const LOCAL = ["local-intro","local-blocked","local-pipeline","local-demo-a","local-demo-b","local-control","local-sovereignty","local-conclusion"];

/* base used to resolve The Pocket Company assets (images/videos) from the live deployment */
const POCKET_BASE = 'https://turncloud.thepocket.company/';

const SLIDES = [];
NEMO.forEach(n => SLIDES.push({ type:'image', src:'img/nemo/'+n+'.png', chap:'NemoClaw × Nemotron · The Pocket Company' }));
POCKET.forEach(n => SLIDES.push({ type:'pocket', src:'pocket/'+n+'.html', chap:'騰雲產品發表會 · TSpace 精選' }));
LOCAL.forEach(n => SLIDES.push({ type:'html', src:'slides/'+n+'.html', chap:'地端多模態工作流 · ComfyUI × RTX 5090' }));

/* ── engine ── */
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const chapEl=document.getElementById('chap');
const countEl=document.getElementById('count');
const grid=document.getElementById('grid');
let cur=0;
const nodes=[];

function build(){
  SLIDES.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide';
    if(s.type==='image'){ const im=document.createElement('img'); im.src=s.src; im.loading=(i<3?'eager':'lazy'); d.appendChild(im); }
    else { const f=document.createElement('iframe'); f.dataset.src=s.src; f.dataset.kind=s.type; d.appendChild(f); }
    stage.appendChild(d); nodes.push(d);
  });
}
function loadFrame(i){
  const s=SLIDES[i]; if(!s||s.type==='image') return;
  const f=nodes[i].querySelector('iframe');
  if(!f || f.dataset.loaded) return;
  f.dataset.loaded='1';
  // 載入完成立即同步媒體：停掉被預載而自動播放（含出聲）的鄰頁
  f.addEventListener('load', syncMedia);
  if(s.type==='pocket'){
    // pull the split slide, inject a <base> so its img/ + video paths resolve from the live deck
    fetch(f.dataset.src).then(r=>r.text()).then(t=>{
      t=t.replace('<head>','<head><base href="'+POCKET_BASE+'">');
      f.srcdoc=t;
    }).catch(()=>{ f.src=f.dataset.src; });
  } else {
    f.src=f.dataset.src;
  }
}
/* ── 媒體控管：聲音/影片只在「目前這一頁」播放，翻頁即停 ──
   - 非 active 頁：所有 <video>/<audio> 一律 pause 並歸零（currentTime=0）
   - active 頁：只自動續播「靜音背景循環」(loop muted、無 controls)；
     有 controls 的含聲音 demo 交給簡報者點擊播放。 */
function syncMedia(){
  nodes.forEach((node,i)=>{
    const f=node.querySelector('iframe'); if(!f) return;
    let doc; try{ doc=f.contentDocument; }catch(e){ return; }
    if(!doc) return;
    const active=(i===cur);
    doc.querySelectorAll('video,audio').forEach(m=>{
      if(active && m.muted && !m.hasAttribute('controls')){
        const p=m.play&&m.play(); if(p&&p.catch) p.catch(()=>{});
      } else {
        try{ m.pause(); }catch(e){}
        if(!active){ try{ m.currentTime=0; }catch(e){} }
      }
    });
  });
}
function show(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  nodes[cur].classList.remove('active');
  cur=i; nodes[cur].classList.add('active');
  loadFrame(i); loadFrame(i+1); loadFrame(i+2);
  bar.style.width=((i+1)/SLIDES.length*100)+'%';
  chapEl.textContent=SLIDES[i].chap||'';
  countEl.textContent=(i+1)+' / '+SLIDES.length;
  // preload neighbour images
  [i+1,i+2].forEach(j=>{ if(SLIDES[j]&&SLIDES[j].type==='image'){ const im=new Image(); im.src=SLIDES[j].src; }});
  syncMedia();   // 切頁後立刻停掉非當前頁的聲音/影片
}
function next(){ show(cur+1); } function prev(){ show(cur-1); }

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ next(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ prev(); e.preventDefault(); }
  else if(e.key==='Home'){ show(0); }
  else if(e.key==='End'){ show(SLIDES.length-1); }
  else if(e.key==='o'||e.key==='O'){ toggleGrid(); }
  else if(e.key==='Escape'){ grid.classList.remove('show'); }
  else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});

/* overview */
function toggleGrid(){
  if(grid.classList.contains('show')){ grid.classList.remove('show'); return; }
  grid.innerHTML='';
  SLIDES.forEach((s,i)=>{
    const c=document.createElement('div'); c.className='cell'+(i===cur?' cur':'');
    if(s.type==='image'){ const im=document.createElement('img'); im.src=s.src; c.appendChild(im); }
    else { const p=document.createElement('div'); p.className='ph'; p.textContent=s.label||s.src; c.appendChild(p); }
    const l=document.createElement('div'); l.className='lbl'; l.textContent=(i+1); c.appendChild(l);
    c.onclick=()=>{ show(i); grid.classList.remove('show'); };
    grid.appendChild(c);
  });
  grid.classList.add('show');
}

/* scaling */
function fit(){
  const vw=innerWidth, vh=innerHeight;
  const s=Math.min(vw/1920, vh/1080);
  stage.style.transform='scale('+s+')';
}
addEventListener('resize',fit);

/* swipe */
let tx=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50){ dx<0?next():prev(); }},{passive:true});

build(); fit(); show(0);
</script>
</body>
</html>
