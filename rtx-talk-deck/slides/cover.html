<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.slide{justify-content:center;padding:120px;}
.cv-top{position:absolute;top:64px;left:120px;right:120px;display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-family:'JetBrains Mono',monospace;letter-spacing:.14em;font-size:15px;}
.cv-top .badge{display:flex;align-items:center;gap:12px;font-weight:700;color:#fff;}
.cv-top .badge .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--nv),#3f6212);}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.18em;color:var(--nv-light);text-transform:uppercase;margin-bottom:14px;}
.cv-brand{font-size:56px;font-weight:900;color:#fff;letter-spacing:-.01em;margin-bottom:18px;}
.cv-brand .n{color:var(--nv-light);}
.cv-h{font-size:150px;line-height:1.02;font-weight:900;color:#fff;letter-spacing:-.02em;}
.cv-h .n{color:var(--nv-light);}
.cv-h .x{color:var(--dim);font-weight:700;}
.cv-sub{font-size:34px;color:var(--dim);margin-top:40px;line-height:1.5;max-width:1450px;}
.cv-sub b{color:var(--ink);font-weight:800;}
.cv-foot{position:absolute;bottom:64px;left:120px;right:120px;display:flex;align-items:center;gap:30px;color:var(--dim-2);font-size:19px;}
.cv-foot .sep{width:1px;height:26px;background:var(--line-soft);}
.cv-foot b{color:var(--ink);font-weight:700;}
</style></head>
<body><div class="slide">
  <div class="cv-top">
    <div class="badge"><div class="dot"></div>ACCUCRAZY × TURNCLOUD</div>
    <div>NVIDIA RTX · GeForce RTX 5090</div>
  </div>

  <div class="eyebrow">On-Prem Multimodal AI · NemoClaw × Nemotron</div>
  <div class="cv-brand">The <span class="n">Pocket</span> Company</div>
  <h1 class="cv-h">讓<span class="n">口袋員工</span>，<br>幫你上班。</h1>
  <div class="cv-sub">一整排 AI 員工待命 —— 從<b>社群輿情</b>、<b>文案生成</b>到<b>影音成片</b>，整套行銷工作流搬回一張 <b>RTX 5090</b> 上跑。<br>這是「雲端服務落到地端」的商機示範。</div>

  <div class="cv-foot">
    <span>Supported by <b>NVIDIA Inception</b></span><div class="sep"></div>
    <span><b>AWS</b></span><div class="sep"></div>
    <span><b>Google Cloud</b></span><div class="sep"></div>
    <span>TurnCloud <b>TWSE:6870</b></span>
  </div>
</div></body></html>
