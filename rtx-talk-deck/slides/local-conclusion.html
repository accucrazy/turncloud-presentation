<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.slide{justify-content:center;}
.kick{font-size:20px;font-weight:700;letter-spacing:.24em;color:var(--nv-light);text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
h1.big{font-size:96px;line-height:1.12;margin-top:22px;font-weight:900;letter-spacing:-.02em;color:#fff;}
h1.big .g{background:linear-gradient(100deg,var(--nv-light),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.eq{display:flex;align-items:center;gap:26px;margin-top:56px;flex-wrap:wrap;}
.eq .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 34px;font-size:30px;font-weight:900;color:#fff;}
.eq .box small{display:block;font-size:16px;font-weight:400;color:var(--dim-2);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.eq .op{font-size:40px;font-weight:900;color:var(--nv);}
.eq .box.out{background:linear-gradient(160deg,rgba(118,185,0,.18),rgba(118,185,0,.05));border-color:var(--nv);color:var(--nv-light);}
.punch{margin-top:56px;font-size:46px;font-weight:900;color:#fff;line-height:1.4;}
.punch .g{color:var(--nv-light);}
.sub2{font-size:26px;color:var(--dim);margin-top:20px;}
.sub2 b{color:var(--ink);}
</style></head>
<body><div class="slide">
  <div class="brand"><div class="l"><div class="dot"></div>Local Multimodal Workflow</div><div class="r">ComfyUI × RTX 5090 · On-Prem</div></div>

  <div>
    <div class="kick">Conclusion · 我研究的東西</div>
    <h1 class="big">這門學問，叫 <span class="g">Content Tech</span>。</h1>

    <div class="eq">
      <div class="box">內容<small>CONTENT · 會賣的素材</small></div>
      <div class="op">×</div>
      <div class="box">工程<small>TECH · 可複製的產線</small></div>
      <div class="op">=</div>
      <div class="box out">一晚出完一條商品線</div>
    </div>

    <div class="punch">每一個被雲端說「NO」的需求，<br>都是一門<span class="g">等著落地的生意</span>。</div>
    <div class="sub2">內衣只是開始 ── 換成醫美、保健、金融…… <b>每落地一條產線，就是一個市場。</b></div>
  </div>

  <div class="foot"><span>Local Multimodal Workflow · ComfyUI × RTX 5090</span><span class="pg">CH 03 · CONTENT TECH</span></div>
</div></body></html>
