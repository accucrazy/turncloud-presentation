<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.wrap{display:grid;grid-template-columns:1fr 1.6fr;gap:26px;flex:1;min-height:0;margin-top:36px;}
.shot,.videobox{min-height:0;}
.videobox{background:var(--panel);border:1px solid var(--line-soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;}
.videobox .cap{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.14em;color:var(--dim);margin-bottom:14px;display:flex;justify-content:space-between;}
.videobox .cap b{color:var(--nv-light);}
</style></head>
<body><div class="slide">
  <div class="brand"><div class="l"><div class="dot"></div>Local Multimodal Workflow</div><div class="r">ComfyUI × RTX 5090 · On-Prem</div></div>

  <div class="kicker">落地 02 · Banana（視覺專家）· 生片</div>
  <h1>同一組素材往下跑：圖會動了，<span class="c">片也有了</span></h1>
  <p class="sub">實穿圖直接餵進 <b>image-to-video</b> ── 走位、轉身、髮絲飄動，全程<b>不離開這台機器</b>。</p>

  <div class="wrap">
    <div class="shot">
      <div class="cap"><span>INPUT · 地端實穿圖</span><b>from Demo A · Beryl</b></div>
      <div class="box"><img src="../img/local/beryl_young_hot_tryon.png" alt="Beryl 實穿圖 input"></div>
    </div>
    <div class="videobox">
      <div class="cap"><span>OUTPUT · 地端生成影片</span><b>i2v · RTX 5090</b></div>
      <div class="box"><video src="../img/local/vs_local_beryl.mp4" poster="../img/local/vs_local_beryl.jpg" muted loop playsinline></video></div>
    </div>
  </div>

  <div class="foot"><span>Local Multimodal Workflow · ComfyUI × RTX 5090</span><span class="pg">CH 03 · DEMO B</span></div>
</div></body></html>
