<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.slide{justify-content:center;}
.kick{font-size:20px;font-weight:700;letter-spacing:.24em;color:var(--nv-light);text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
h1.big{font-size:104px;line-height:1.1;margin-top:22px;font-weight:900;letter-spacing:-.02em;color:#fff;}
h1.big .g{background:linear-gradient(100deg,var(--nv-light),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px;}
.p{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:36px 34px;position:relative;overflow:hidden;}
.p::after{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--nv),transparent);}
.p .ic{font-size:44px;}
.p h3{font-size:38px;font-weight:900;color:#fff;margin:16px 0 12px;}
.p .d{font-size:24px;color:var(--dim);line-height:1.5;}
.p .d b{color:var(--nv-light);}
.punch{margin-top:52px;font-size:44px;font-weight:900;color:#fff;line-height:1.35;}
.punch .g{color:var(--nv-light);}
</style></head>
<body><div class="slide">
  <div class="brand"><div class="l"><div class="dot"></div>Local Multimodal Workflow</div><div class="r">ComfyUI × RTX 5090 · On-Prem</div></div>

  <div>
    <div class="kick">The Concept · 這件事有個名字</div>
    <h1 class="big">這叫 <span class="g">算力主權</span>。</h1>

    <div class="trio">
      <div class="p"><div class="ic">🔒</div><h3>素材是我的</h3><div class="d">商品照<b>不出機房</b>，<br>沒人審核我。</div></div>
      <div class="p"><div class="ic">💰</div><h3>算力是我的</h3><div class="d">一次性硬體，<b>跑越多越便宜</b>，不看漲價臉色。</div></div>
      <div class="p"><div class="ic">🧠</div><h3>能力是我的</h3><div class="d">模型版本自己釘，<b>沒人能一夕收回</b>。</div></div>
    </div>

    <div class="punch">一張消費級 GPU，就是<span class="g">主權的最小單位</span>。</div>
  </div>

  <div class="foot"><span>Local Multimodal Workflow · ComfyUI × RTX 5090</span><span class="pg">CH 03 · SOVEREIGNTY</span></div>
</div></body></html>
