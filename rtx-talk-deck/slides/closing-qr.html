<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:60px;flex:1;min-height:0;align-items:center;}
.msg .thanks{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.22em;color:var(--nv-light);text-transform:uppercase;margin-bottom:20px;}
.msg h1{font-size:96px;line-height:1.05;}
.msg .sub{font-size:30px;color:var(--dim);margin-top:28px;line-height:1.55;max-width:820px;}
.msg .sub b{color:var(--ink);}
.msg .ig{margin-top:34px;display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:800;color:#fff;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 26px;}
.msg .ig .at{color:var(--nv-light);font-family:'JetBrains Mono',monospace;}
.qr{display:flex;flex-direction:column;align-items:center;gap:18px;}
.qr img{width:auto;height:640px;max-width:100%;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:block;}
.qr .scan{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
</style></head>
<body><div class="slide" style="justify-content:center;">
  <div class="brand"><div class="l"><div class="dot"></div>The Pocket Company · Accucrazy × TurnCloud</div><div class="r">THANK YOU</div></div>

  <div class="wrap">
    <div class="msg">
      <div class="thanks">Thank You</div>
      <h1>把<span class="g">雲端服務</span>，<br>落到<span class="g">地端</span>。</h1>
      <div class="sub">有自己的管線，影片就能源源不絕 —— <b>雲端驗證創意，地端量產交付</b>。歡迎追蹤、一起把 Content Tech 落地。</div>
      <div class="ig"><span class="at">@</span>accucrazy.eth</div>
    </div>
    <div class="qr">
      <img src="../img/misc/ig_qr.png" alt="Instagram QR @accucrazy.eth">
      <div class="scan">Scan · 掃描追蹤 IG</div>
    </div>
  </div>

  <div class="foot"><span>The Pocket Company · Accucrazy × TurnCloud · RTX AI PC 講座</span><span class="pg">THANK YOU</span></div>
</div></body></html>
