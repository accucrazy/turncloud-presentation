<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="local.css">
<style>
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;flex:1;min-height:0;margin-top:30px;}
.rvid{display:flex;flex-direction:column;gap:12px;min-height:0;}
.rvid .box{flex:1;border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(251,191,36,.28);min-height:0;box-shadow:0 18px 40px rgba(0,0,0,.4);}
.rvid .box video{width:100%;height:100%;object-fit:cover;display:block;}
.rvid .cap{display:flex;align-items:center;justify-content:space-between;font-size:18px;color:var(--dim);}
.rvid .cap b{color:var(--gold);font-weight:800;}
.rvid .cap .mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--dim-2);letter-spacing:.08em;}
.note{margin-top:20px;}
</style></head>
<body><div class="slide">
  <div class="brand"><div class="l"><div class="dot"></div>Local Multimodal Workflow</div><div class="r">ComfyUI × RTX 5090 · On-Prem</div></div>

  <div class="kicker" style="color:var(--gold);">Cloud Side · 成品度雲端補足</div>
  <h1>同一件商品，<span style="color:var(--gold);">四種廣告情緒</span>，幾分鐘出片。</h1>

  <div class="wall">
    <div class="rvid"><div class="box"><video src="../img/walls/ad_noir.mp4" poster="../img/walls/ad_noir.jpg" muted loop playsinline></video></div><div class="cap"><b>Noir</b><span class="mono">冷冽夜色</span></div></div>
    <div class="rvid"><div class="box"><video src="../img/walls/ad_festive.mp4" poster="../img/walls/ad_festive.jpg" muted loop playsinline></video></div><div class="cap"><b>Festive</b><span class="mono">節慶暖光</span></div></div>
    <div class="rvid"><div class="box"><video src="../img/walls/ad_sunlit.mp4" poster="../img/walls/ad_sunlit.jpg" muted loop playsinline></video></div><div class="cap"><b>Sunlit</b><span class="mono">日光通透</span></div></div>
    <div class="rvid"><div class="box"><video src="../img/walls/ad_stillness.mp4" poster="../img/walls/ad_stillness.jpg" muted loop playsinline></video></div><div class="cap"><b>Stillness</b><span class="mono">靜物質感</span></div></div>
  </div>

  <div class="note">這批交給雲端 <span class="hl" style="color:var(--gold);">Seedance</span>：運鏡、光線、配樂一次到位 —— 能過審的成品走雲端，敏感與要控的走地端，<span class="hl">混合才是正解</span>。</div>
  <div class="foot"><span>Local Multimodal Workflow · ComfyUI × RTX 5090</span><span class="pg">CH 03 · AD WALL</span></div>
</div></body></html>
