          - "開車時看不到寶寶，紅燈才偷瞄後照鏡"
          - "高溫車內新聞看了就心驚"
          - "想跟另一半<strong>共享即時畫面</strong>"
      - color: green
        title: "他們怎麼買"
        bullets:
          - "靠 <strong>IG Reels · TikTok · 爸爸部落客</strong>發現"
          - "上 Reddit / 評論區查證"
          - "手機 <strong>Shop Pay / Apple Pay</strong> 一鍵下單"
    meta_left: "★ 客群 · 美 / 加 / 日 / 台 首發市場"

