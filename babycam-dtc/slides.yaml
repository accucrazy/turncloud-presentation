  # ─── 03 · 為什麼先做 DTC ────────────────────────────────────────────
  - id: why_dtc
    template: chapter
    tone: orange
    eyebrow: "策略 · 為什麼先走 DTC"
    title: '硬體要的是<span class="c">品牌</span>，不只是<span class="v">通路</span>。'
    lede: '走 OEM 衝量、卻交出了品牌與客戶；先走 DTC，建立<strong>定價權、第一方數據、社群</strong>——之後再回頭談 Toyota，是站著談。'
    bullets:
      - tone: cyan
        label: "01 · 毛利留在自己手上"
        text: 'OEM 通路吃掉 <strong>5–7 成</strong>；DTC 自己賣，單台貢獻毛利約是經銷 SKU 的 <strong>2.5 倍</strong>。'
      - tone: orange
        label: "02 · 客戶是自己的"
        text: 'OEM 從不告訴你誰買了。DTC 拿到 <strong>email · 車型 · 寶寶月齡 · 郵遞區</strong>——讓 Meta / Google 投放真正精準。'
      - tone: violet
        label: "03 · 品牌大於 SKU"
        text: 'Owlet、Nanit 都是<strong>先 DTC 建品牌</strong>、再進 Target。車內這個品類沒有對手，<strong>我們定義它</strong>。'
    tagline: 'DTC 是<strong>護城河</strong>，OEM 是之後賺到的<strong>上檔</strong>。'
    meta_left: "★ 為什麼先做 DTC"

