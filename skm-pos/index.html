<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>新光三越 POS 客顯影片</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; cursor: pointer; user-select: none; -webkit-user-select: none; }
  body.idle { cursor: none; }
  .slide { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
    opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  .slide.on { opacity: 1; }
  .dots { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px;
    padding: 8px 14px; border-radius: 100px; background: rgba(0,0,0,.45); transition: opacity .4s; z-index: 5; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .dots i.on { background: #fff; }
  body.idle .dots { opacity: 0; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(0,0,0,.72); color: #fff; text-align: center; }
  #start b { font-size: 34px; letter-spacing: 2px; }
  #start span { font-size: 16px; opacity: .75; }
  #start.gone { display: none; }
</style>
</head>
<body>
<video class="slide" src="01.mp4" muted loop playsinline preload="auto"></video>
<video class="slide" src="02.mp4" muted loop playsinline preload="metadata"></video>
<video class="slide" src="03.mp4" muted loop playsinline preload="metadata"></video>
<video class="slide" src="04.mp4" muted loop playsinline preload="metadata"></video>
<video class="slide" src="05.mp4" muted loop playsinline preload="metadata"></video>
<video class="slide" src="06.mp4" muted loop playsinline preload="metadata"></video>
<div class="dots" id="dots"></div>
<div id="start"><b>點一下開始播放</b><span>全螢幕 · 點右側或按 → 下一支 · 點左側或按 ← 上一支</span></div>
<script>
const slides = [...document.querySelectorAll('.slide')];
const dots = document.getElementById('dots');
const start = document.getElementById('start');
slides.forEach(() => dots.appendChild(document.createElement('i')));
let cur = 0;

function show(n) {
  slides[cur].classList.remove('on');
  slides[cur].pause();
  cur = (n + slides.length) % slides.length;
  const v = slides[cur];
  v.classList.add('on');
  v.currentTime = 0;
  v.play().catch(() => {});
  // 預先載入下一支,切換不卡
  const nx = slides[(cur + 1) % slides.length];
  if (nx.preload !== 'auto') { nx.preload = 'auto'; nx.load(); }
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
  wake();
}

function fullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
}

let started = false;
function begin() { started = true; start.classList.add('gone'); fullscreen(); show(cur); }

document.addEventListener('click', e => {
  if (!started) return begin();
  fullscreen();
  show(cur + (e.clientX < window.innerWidth * 0.25 ? -1 : 1));
});
document.addEventListener('keydown', e => {
  const k = e.key;
  if (!started && (k === 'Enter' || k === ' ')) { e.preventDefault(); return begin(); }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); show(cur - 1); }
  else if (k === 'Home') show(0);
  else if (k === 'End') show(slides.length - 1);
  else if (k === 'f' || k === 'F') fullscreen();
});

// 滑鼠與頁碼點點閒置 2 秒後隱藏
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000);
}
document.addEventListener('mousemove', wake);

// 沒點之前先把第一支放在背景播
slides[0].classList.add('on');
slides[0].play().catch(() => {});
[...dots.children][0].classList.add('on');
</script>
</body>
</html>
