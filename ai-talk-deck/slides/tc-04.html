<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><link rel="stylesheet" href="tc.css">
<style>
.hubs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:36px;}
.hub{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;position:relative;overflow:hidden;}
.hub .rk{position:absolute;right:18px;top:14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff;background:var(--blue-2);padding:3px 10px;border-radius:999px;}
.hub .cty{font-size:30px;font-weight:900;color:var(--navy);}
.hub .yr{font-size:16px;color:var(--dim);margin-top:6px;font-family:'JetBrains Mono',monospace;}
.hub.base{background:linear-gradient(135deg,var(--navy),var(--navy-2));}
.hub.base .cty{color:#fff;} .hub.base .yr{color:#9db6e6;}
</style></head>
<body><div class="slide">
  <div class="brand"><div class="l"><div class="dot"></div>騰雲科技 TURN CLOUD</div><div class="r">6870.TW · 國際佈局</div></div>
  <div class="kicker">Global Expansion</div>
  <h1>國際代理 ＋ 在地策略 ── <span class="c">快速進入市場</span></h1>
  <div class="sub">國際策略夥伴生態系，結合重要市場的在地化發展策略；海外市場驅動營收強勁成長。</div>
  <div class="hubs">
    <div class="hub base"><div class="cty">台灣</div><div class="yr">2016 · 總部</div></div>
    <div class="hub"><span class="rk">HUB 1</span><div class="cty">越南</div><div class="yr">1st HUB</div></div>
    <div class="hub"><span class="rk">HUB 2</span><div class="cty">印尼</div><div class="yr">2nd HUB</div></div>
    <div class="hub"><span class="rk">HUB 3</span><div class="cty">日本</div><div class="yr">2024 · 3rd HUB</div></div>
    <div class="hub"><span class="rk">HUB 4</span><div class="cty">菲律賓</div><div class="yr">4th HUB</div></div>
    <div class="hub"><div class="cty">泰國</div><div class="yr">2025</div></div>
    <div class="hub"><div class="cty">馬來西亞</div><div class="yr">2022</div></div>
    <div class="hub"><div class="cty">中國</div><div class="yr">2017</div></div>
  </div>
  <div class="fill"></div>
  <div class="kpis"><div class="kpi dark"><div class="v">&gt;41<small>%</small></div><div class="l">海外營收占比 ── 海外市場驅動營收強勁成長</div></div>
    <div class="kpi"><div class="v">8</div><div class="l">市場據點（4 大海外 HUB）</div></div></div>
  <div class="foot"><span>國際市場與產業類型持續放大</span><span class="pg">04</span></div>
</div></body></html>
