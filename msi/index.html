<style>
html, body { margin: 0; height: 100%; background: #070c0f; overflow: hidden; -webkit-text-size-adjust: 100%; }
#dk-stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; background: #0e161b; }
#dk-stage * { box-sizing: border-box; }

/* one slide = one 1920x1080 section; only the current one is shown */
#dk-stage > section { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  overflow-wrap: break-word; visibility: hidden; opacity: 0; transition: opacity .28s ease, visibility 0s linear .28s; }
#dk-stage > section.on { visibility: visible; opacity: 1; transition: opacity .28s ease; }
#dk-stage > section:not([style*="display"]) { display: flex; flex-direction: column; }
/* The slide format paints children in source order, so text written after a pinned backdrop sits on top of it.
   Plain CSS would paint the pinned backdrop over the text; making the flow children positioned restores source order. */
#dk-stage > section > :not([style*="position"]) { position: relative; }

/* the slide format's element defaults (inline styles on each element override these) */
#dk-stage :where(h1, h2, h3, p, ul, ol, table, hr) { margin: 0; }
#dk-stage :where(h1) { font-size: 96px; font-weight: 600; line-height: 1.1; }
#dk-stage :where(h2) { font-size: 64px; font-weight: 600; line-height: 1.15; }
#dk-stage :where(h3) { font-size: 44px; font-weight: 600; line-height: 1.2; }
#dk-stage :where(p) { font-size: 32px; font-weight: 400; line-height: 1.4; }
#dk-stage :where(ul, ol) { padding-left: 1.15em; }
#dk-stage div:not([style*="display"]) { display: flex; flex-direction: column; }
#dk-stage img { display: block; flex: none; max-width: none; }
#dk-stage table { border-collapse: collapse; width: 100%; }
#dk-stage :where(th, td) { padding: .35em .6em; text-align: left; vertical-align: top; font-weight: 400;
  border-bottom: 1px solid rgba(127, 127, 127, .4); }
#dk-stage :where(th) { font-weight: 600; }
#dk-stage aside { display: none; }
#dk-stage x-shape { display: block; flex: none; }
#dk-stage x-shape[kind="ellipse"] { border-radius: 50%; }
#dk-stage x-shape[kind="diamond"] { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
#dk-stage x-shape[kind="arrow-right"] { clip-path: polygon(0 28%, 60% 28%, 60% 0, 100% 50%, 60% 100%, 60% 72%, 0 72%); }
#dk-stage x-shape[kind="arrow-left"] { clip-path: polygon(100% 28%, 40% 28%, 40% 0, 0 50%, 40% 100%, 40% 72%, 100% 72%); }
#dk-stage x-shape[kind="arrow-down"] { clip-path: polygon(28% 0, 72% 0, 72% 60%, 100% 60%, 50% 100%, 0 60%, 28% 60%); }
#dk-stage x-shape[kind="arrow-up"] { clip-path: polygon(28% 100%, 72% 100%, 72% 40%, 100% 40%, 50% 0, 0 40%, 28% 40%); }
#dk-stage svg.x-icon { display: block; flex: none; }

/* viewer controls: shown on pointer movement, hidden while presenting */
#dk-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
  padding: 5px 6px; border-radius: 999px; background: rgba(14, 22, 27, .9); border: 1px solid rgba(255, 255, 255, .16);
  font: 500 14px/1 system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #d9e2e6;
  opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
body.ui #dk-bar { opacity: 1; pointer-events: auto; }
#dk-bar button, #dk-bar a { all: unset; cursor: pointer; padding: 9px 13px; border-radius: 999px; color: #d9e2e6; }
#dk-bar button:hover, #dk-bar a:hover { background: rgba(255, 255, 255, .13); }
#dk-bar button:focus-visible, #dk-bar a:focus-visible { outline: 2px solid #f2a33a; }
#dk-bar a { color: #f2a33a; }
#dk-num { min-width: 62px; text-align: center; font-variant-numeric: tabular-nums; }
#dk-notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 36vh; overflow: auto; display: none;
  padding: 16px 22px 70px; background: rgba(7, 12, 15, .95); border-top: 1px solid rgba(255, 255, 255, .16);
  font: 400 17px/1.75 system-ui, -apple-system, "Noto Sans TC", sans-serif; color: #e8eef1; }
body.notes #dk-notes { display: block; }
@media (prefers-reduced-motion: reduce) { #dk-stage > section, #dk-stage > section.on, #dk-bar { transition: none; } }
/* An embedded player (a video slide): the frame is made when its slide opens and removed when it closes. */
#dk-stage [data-embed] { display: block; flex: none; background: #000; overflow: hidden; }
#dk-stage [data-embed] iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: block; }
#dk-gate { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px;
  background: #f3f7fc; color: #0f172a; font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.7; }
#dk-gate * { box-sizing: border-box; }
#dk-gate .card { background: #fff; border: 1px solid #dde6f2; border-radius: 16px; padding: 38px 40px; width: 100%; max-width: 420px; }
#dk-gate .kick { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .16em; color: #0e7490; font-weight: 600; margin-bottom: 14px; }
#dk-gate h1 { font-size: 22px; font-weight: 900; margin: 0 0 8px; }
#dk-gate p.sub { font-size: 14px; color: #475569; margin: 0 0 22px; }
#dk-gate form { display: flex; gap: 9px; }
#dk-gate input { flex: 1; min-width: 0; font-family: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid #b6c6da; border-radius: 9px; background: #f3f7fc; color: #0f172a; }
#dk-gate input:focus { outline: 2px solid #0e7490; outline-offset: 1px; background: #fff; }
#dk-gate button { font-family: inherit; font-size: 15px; font-weight: 700; padding: 11px 20px; border: none; border-radius: 9px; background: #0e7490; color: #fff; cursor: pointer; white-space: nowrap; }
#dk-gate button:focus-visible { outline: 2px solid #0f172a; outline-offset: 2px; }
#dk-gate button:disabled { opacity: .55; cursor: default; }
#dk-gate .msg { font-size: 13.5px; margin-top: 14px; min-height: 20px; color: #475569; }
#dk-gate .msg.err { color: #be123c; font-weight: 700; }

// assetKey: the AES-GCM key of a locked copy, or null when the pictures are plain files
function startDeck(assetKey) {
  var stage = document.getElementById('dk-stage');
  var slides = Array.prototype.filter.call(stage.children, function (e) { return e.tagName === 'SECTION'; });
  var n = slides.length, cur = -1;
  var num = document.getElementById('dk-num'), notes = document.getElementById('dk-notes');
  var notesBtn = document.getElementById('dk-notesBtn'), bar = document.getElementById('dk-bar');

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  // Images load only for the current slide and its neighbours, so opening the deck does not pull every picture at once.
  var opened = {};
  function openSealed(url, mime) {  // a sealed picture: 12 bytes of IV, then the AES-GCM ciphertext
    if (!opened[url]) opened[url] = fetch(url)
      .then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.arrayBuffer(); })
      .then(function (buf) { var u = new Uint8Array(buf);
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, assetKey, u.subarray(12)); })
      .then(function (plain) { return URL.createObjectURL(new Blob([plain], { type: mime })); });
    return opened[url];
  }
  function load(i) {
    if (i < 0 || i >= n) return;
    Array.prototype.forEach.call(slides[i].querySelectorAll('img[data-src], img[data-sealed]'), function (im) {
      var sealed = im.getAttribute('data-sealed');
      if (sealed) {
        im.removeAttribute('data-sealed');
        openSealed(sealed, im.getAttribute('data-mime')).then(function (u) { im.src = u; })
          .catch(function (e) { console.error('picture not opened', e); });
      } else { im.src = im.getAttribute('data-src'); im.removeAttribute('data-src'); }
    });
  }
  // An embedded player exists only while its slide is showing, so a video stops when the reader moves on.
  // The frame is added and removed (never re-pointed), which keeps it out of the browser's Back history.
  function embeds(i, on) {
    Array.prototype.forEach.call(slides[i].querySelectorAll('[data-embed]'), function (box) {
      box.textContent = '';
      if (!on) return;
      var f = document.createElement('iframe');
      f.src = box.getAttribute('data-embed');
      f.title = box.getAttribute('data-title') || '';
      f.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      f.referrerPolicy = 'no-referrer';
      box.appendChild(f);
    });
  }
  function go(i) {
    i = Math.max(0, Math.min(n - 1, i));
    if (i === cur) return;
    if (cur >= 0) { slides[cur].classList.remove('on'); embeds(cur, false); }
    cur = i;
    load(i); load(i + 1); load(i + 2); load(i - 1);
    slides[i].classList.add('on'); embeds(i, true);
    num.textContent = (i + 1) + ' / ' + n;
    if (notes) {
      var a = slides[i].querySelector('aside');
      notes.textContent = a ? a.textContent : '（這一頁沒有講稿）';
    }
    var h = '#slide-' + (i + 1);
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function fromHash() {
    var h = decodeURIComponent(location.hash.slice(1)), m = /^slide-(\d+)$/.exec(h);
    if (m) return parseInt(m[1], 10) - 1;
    for (var i = 0; i < n; i++) if (slides[i].id === h) return i;
    return 0;
  }
  function toggleNotes() {
    if (!notes) return;
    var on = document.body.classList.toggle('notes');
    notesBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  var hideTimer = 0;
  function showUi() {
    document.body.classList.add('ui');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) document.body.classList.remove('ui'); }, 2600);
  }

  document.getElementById('dk-prev').addEventListener('click', function () { go(cur - 1); });
  document.getElementById('dk-next').addEventListener('click', function () { go(cur + 1); });
  if (notesBtn) notesBtn.addEventListener('click', toggleNotes);
  document.getElementById('dk-fs').addEventListener('click', fullscreen);
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { go(cur + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { go(cur - 1); e.preventDefault(); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(n - 1);
    else if (k === 'n' || k === 'N') toggleNotes();
    else if (k === 'f' || k === 'F') fullscreen();
  });
  stage.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    go(cur + (e.clientX < window.innerWidth * 0.3 ? -1 : 1));
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; showUi(); }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) { go(cur + (dx < 0 ? 1 : -1)); }
  }, { passive: true });
  document.addEventListener('mousemove', showUi);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () { go(fromHash()); });
  fit(); go(fromHash()); showUi();
}
